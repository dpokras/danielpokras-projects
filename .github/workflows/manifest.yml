name: Rebuild photo manifest

on:
  push:
    paths:
      - "images/**"
      - "captions.json"
      - "tools/build-manifest.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-manifest.mjs
      - name: Commit photos.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json
          git diff --staged --quiet || git commit -m "Rebuild photo manifest"
          git push
